name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4.2"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "12.3.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and terminal
      placeholder: "macOS 15, iTerm2"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure `dev-mesh.projects` with ...
        2. Run `php artisan dev`
        3. ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config/dev-mesh.php
      render: php
  - type: textarea
    id: output
    attributes:
      label: Output or stack trace
      render: shell
